[project]
name = "cyp-competition"
version = "0.1.0"
description = "Modelling code for the OpenADMET CYP Inhibition Blind Challenge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "polars>=1.20",
    # Pandas is a boundary dependency only: the vendored official validators and
    # sklearn expect it. Project code uses Polars -- see CLAUDE.md.
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "rdkit>=2024.3.1",
    "scikit-fingerprints>=1.6",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # Repeated-measures Tukey HSD for the MCS heatmaps (evaluation.mcs) --
    # pingouin's rm_anova plus statsmodels' studentized-range distribution.
    "pingouin>=0.5",
    "statsmodels>=0.14",
    "tqdm>=4.66",
    "loguru>=0.7",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
notebook = [
    "marimo>=0.9",
    "altair>=5.4",
    "mols2grid>=2.0",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
