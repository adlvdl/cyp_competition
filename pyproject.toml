[project]
name = "cyp-competition"
version = "0.1.0"
description = "Modelling code for the OpenADMET CYP Inhibition Blind Challenge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "polars>=1.20",
    # Pandas is a boundary dependency only: the vendored official validators and
    # sklearn expect it. Project code uses Polars -- see CLAUDE.md.
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "rdkit>=2024.3.1",
    "scikit-fingerprints>=1.6",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # Repeated-measures Tukey HSD for the MCS heatmaps (evaluation.mcs) --
    # pingouin's rm_anova plus statsmodels' studentized-range distribution.
    "pingouin>=0.5",
    "statsmodels>=0.14",
    "tqdm>=4.66",
    "loguru>=0.7",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
notebook = [
    "marimo>=0.9",
    "altair>=5.4",
    "mols2grid>=2.0",
    # Chemical-space exploration (notebooks/02_chemical_space.py), carried over from
    # the PXR 1a-1e notebooks: UMAP for the embeddings, matplotlib-venn for the
    # activity-cliff overlap diagram, mmpdb for matched molecular pairs, networkx
    # for the MMP network layout.
    "umap-learn>=0.5",
    "matplotlib-venn>=1.1",
    "mmpdb>=3.1",
    "networkx>=3.3",
]
# Heavyweight model families explored in notebooks/03_methods.py. Kept out of the
# core dependency set because torch alone is ~2.5GB and chemprop/CheMeleon download
# pretrained weights on first use -- `import cyp` must stay usable without any of it,
# which is why every module below imports these lazily inside the call, not at the
# module top level (same pattern as `interactive`).
deep = [
    # Chemprop v2 D-MPNN, and the CheMeleon foundation backbone it warm-starts from.
    "chemprop>=2.2",
    "torch>=2.4",
    # Macau / Bayesian matrix factorization with fingerprints as row side-information.
    "smurff>=1.1",
    # Tabular foundation models. Both are installed because they fail differently:
    # TabPFN caps at 500 features (so ECFP4-2048 and CheMeleon-2048 need PCA first)
    # and its weights are non-commercial; TabICL is Apache-2.0 and handles ~2000
    # features natively with a quantile regression head. See 03_methods.py.
    "tabpfn>=2.0",
    "tabicl>=2.0",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP037 wants the quotes off `"plt.Axes | None"`, but matplotlib's Axes is only
# imported for typing in those modules and the quoted form keeps it lazy.
ignore = ["UP037"]

[tool.ruff.lint.per-file-ignores]
# A marimo cell displays its value by ending on a bare expression, which B018
# reads as a useless statement. It is the notebook format, not a mistake.
"notebooks/*.py" = ["B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
