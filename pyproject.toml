[project]
name = "cyp-competition"
version = "0.1.0"
description = "Modelling code for the OpenADMET CYP Inhibition Blind Challenge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # numpy>=2.4 is a correctness requirement, not a preference. Under numpy 2.2.6
    # TabICL returns **all-NaN probabilities** on a ~2,400-row fit and raises
    # nothing: the fit reports success, the subprocess exits 0, and every downstream
    # MCC reads 0.000 as if the model learned nothing. Measured directly by
    # bisection -- clean at numpy 2.4.6, 100% NaN at 2.2.6, same code, same data,
    # same seed. `unimol_tools` pins `numpy<2.3.0`, so installing the `structure`
    # extra silently downgrades numpy and breaks the TDI track; the two cannot share
    # one environment. See CLAUDE.md's environment-traps section.
    "numpy>=2.4",
    "polars>=1.20",
    # Pandas is a boundary dependency only: the vendored official validators and
    # sklearn expect it. Project code uses Polars -- see CLAUDE.md.
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "rdkit>=2024.3.1",
    "scikit-fingerprints>=1.6",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # Repeated-measures Tukey HSD for the MCS heatmaps (evaluation.mcs) --
    # pingouin's rm_anova plus statsmodels' studentized-range distribution.
    "pingouin>=0.5",
    "statsmodels>=0.14",
    "tqdm>=4.66",
    "loguru>=0.7",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
notebook = [
    "marimo>=0.9",
    "altair>=5.4",
    "mols2grid>=2.0",
    # Chemical-space exploration (notebooks/02_chemical_space.py), carried over from
    # the PXR 1a-1e notebooks: UMAP for the embeddings, matplotlib-venn for the
    # activity-cliff overlap diagram, mmpdb for matched molecular pairs, networkx
    # for the MMP network layout.
    "umap-learn>=0.5",
    "matplotlib-venn>=1.1",
    "mmpdb>=3.1",
    "networkx>=3.3",
]
# Heavyweight model families explored in notebooks/03_methods.py. Kept out of the
# core dependency set because torch alone is ~2.5GB and chemprop/CheMeleon download
# pretrained weights on first use -- `import cyp` must stay usable without any of it,
# which is why every module below imports these lazily inside the call, not at the
# module top level (same pattern as `interactive`).
deep = [
    # Chemprop v2 D-MPNN, and the CheMeleon foundation backbone it warm-starts from.
    "chemprop>=2.2",
    "torch>=2.4",
    # Macau / Bayesian matrix factorization with fingerprints as row side-information.
    "smurff>=1.1",
    # Tabular foundation models. Both are installed because they fail differently:
    # TabPFN caps at 500 features (so ECFP4-2048 and CheMeleon-2048 need PCA first)
    # and its weights are non-commercial; TabICL is Apache-2.0 and handles ~2000
    # features natively with a quantile regression head. See 03_methods.py.
    "tabpfn>=2.0",
    "tabicl>=2.0",
]
# Structure-based arms for notebooks/11_docking_3d.py. Separate from `deep` because
# they need an external binary that is not a Python dependency at all: smina, from
# `brew install brewsci/bio/smina`. gnina was the first choice and cannot be used --
# it is CUDA-only (the sole v1.3.3 asset is a 1.96 GB CUDA-12.8 Linux binary) and this
# is an arm64 Mac. See src/cyp/docking.py.
structure = [
    # Protein-ligand interaction fingerprints from docked poses. Pure Python over
    # RDKit + MDAnalysis, so no new binary; preferred over PLIP (report-oriented
    # output needing parsing) and ODDT (unreleased since 2021, OpenBabel bindings).
    "prolif>=2.2",
    "mdanalysis>=2.7",
]

# `unimol_tools` is deliberately NOT in `structure`, and not in any extra installed
# by `make setup`. It pins `numpy<2.3.0`, and numpy 2.2.6 makes TabICL return
# all-NaN probabilities on a ~2,400-row fit while raising nothing -- which silently
# zeroes the whole TDI track (see the `numpy>=2.4` comment above). The two cannot
# share an environment, and `uv sync` fails outright if both are requested.
#
# Notebook 11 is the only code that needs it, that notebook is finished, and its
# conclusion was that no docking-derived arm beat the incumbent. So the default
# environment keeps TabICL working. To re-run 11's Uni-Mol arm, install it into a
# throwaway environment instead:
#
#     uv venv /tmp/unimol && VIRTUAL_ENV=/tmp/unimol uv pip install unimol_tools
#
# `src/cyp/unimol.py` already runs every call in a subprocess, so it can be pointed
# at a different interpreter without touching the rest of the repo.
# (No `unimol` extra: `make setup` runs `uv sync --all-extras`, which would install
# it and re-break TabICL. It has to live outside this file entirely.)
# Frozen 3D molecular encoders for notebooks/16_encoders.py, embedded in a subprocess
# like CheMeleon (torch cannot share a process with LightGBM). Neither pins numpy, so
# unlike `unimol_tools` they coexist with TabICL -- verify that stays true on upgrade:
# `uv pip list | grep numpy` must stay >=2.4. Monroe is not on PyPI; its weights are a
# 300 MB Git LFS file fetched by `cyp.encoders.fetch_monroe_weights` into .encoders/.
encoders = [
    "atom-jepa[rdkit]>=0.3",
    "monroe @ git+https://github.com/blazejba/monroe",
    "datamol>=0.12",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Required for the `encoders` extra: Monroe is only installable from git.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cyp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP037 wants the quotes off `"plt.Axes | None"`, but matplotlib's Axes is only
# imported for typing in those modules and the quoted form keeps it lazy.
ignore = ["UP037"]

[tool.ruff.lint.per-file-ignores]
# A marimo cell displays its value by ending on a bare expression, which B018
# reads as a useless statement. It is the notebook format, not a mistake.
"notebooks/*.py" = ["B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
